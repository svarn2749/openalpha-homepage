<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenAlpha</title>
  <meta name="description" content="OpenAlpha — AI-driven active equity management. Coming soon.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>OpenAlpha</h1>
    <p class="tagline"><span id="typed">Accessible alpha in an AI-driven world</span><span class="cursor" aria-hidden="true">_</span></p>
    <p class="status"><span class="dot"></span>Coming soon</p>
  </main>

  <script>
    // Type the tagline out one character at a time, terminal-style.
    (function () {
      var el = document.getElementById('typed');
      var line = el.parentNode;
      var cursor = line.querySelector('.cursor');
      var text = el.textContent;
      var i = 0;

      line.setAttribute('aria-label', text);
      el.setAttribute('aria-hidden', 'true');
      // Reserve the full width so the centred line doesn't shift as it types.
      line.style.width = (text.length + 1) + 'ch';
      line.classList.add('typing');
      el.textContent = '';

      // Blink for a moment, then type; the cursor holds solid while typing.
      setTimeout(function tick() {
        cursor.classList.add('solid');
        el.textContent = text.slice(0, ++i);
        if (i < text.length) {
          setTimeout(tick, 40 + Math.random() * 80);
        } else {
          cursor.classList.remove('solid');
        }
      }, 1200);
    })();
  </script>
</body>
</html>
